<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Copart Conversational Search</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 900px; margin: 0 auto; padding: 1.5rem;
    background: #f7f7f8; color: #1a1a1a;
  }
  h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
  #subtitle { color: #666; font-size: 0.85rem; margin-bottom: 1rem; }
  #filters-bar {
    background: #fff; border: 1px solid #ddd; border-radius: 8px;
    padding: 0.5rem 0.75rem; margin-bottom: 1rem; font-size: 0.8rem;
    color: #444; min-height: 1.2rem;
  }
  #chat {
    background: #fff; border: 1px solid #ddd; border-radius: 8px;
    height: 55vh; overflow-y: auto; padding: 1rem; margin-bottom: 0.75rem;
  }
  .msg { margin-bottom: 1rem; max-width: 85%; white-space: pre-wrap; line-height: 1.4; }
  .msg.user { margin-left: auto; text-align: right; }
  .msg .bubble { display: inline-block; padding: 0.5rem 0.75rem; border-radius: 10px; }
  .msg.user .bubble { background: #2563eb; color: #fff; }
  .msg.assistant .bubble { background: #f0f0f2; color: #1a1a1a; }
  .results { margin-top: 0.5rem; display: grid; gap: 0.5rem; }
  .card {
    border: 1px solid #e0e0e0; border-radius: 8px; padding: 0.5rem 0.75rem;
    font-size: 0.8rem; background: #fafafa;
  }
  .card b { font-size: 0.9rem; }
  form { display: flex; gap: 0.5rem; }
  input[type=text] {
    flex: 1; padding: 0.6rem 0.75rem; border-radius: 8px; border: 1px solid #ccc; font-size: 0.95rem;
  }
  button {
    padding: 0.6rem 1rem; border-radius: 8px; border: none; background: #2563eb;
    color: #fff; font-size: 0.9rem; cursor: pointer;
  }
  button.secondary { background: #888; }
  button:disabled { opacity: 0.5; cursor: default; }
  #toolbar { display: flex; justify-content: flex-end; margin-bottom: 0.5rem; }
</style>
</head>
<body>
  <h1>Copart Conversational Search</h1>
  <div id="subtitle">Describe what you're looking for, then refine it across turns - e.g. "Ford trucks under $10k with keys in Texas".</div>
  <div id="toolbar"><button class="secondary" id="reset-btn">Reset search</button></div>
  <div id="filters-bar">No filters applied yet.</div>
  <div id="chat"></div>
  <form id="chat-form">
    <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" />
    <button type="submit" id="send-btn">Send</button>
  </form>

<script>
let sessionId = null;

const chatEl = document.getElementById('chat');
const formEl = document.getElementById('chat-form');
const inputEl = document.getElementById('message-input');
const sendBtn = document.getElementById('send-btn');
const filtersBar = document.getElementById('filters-bar');
const resetBtn = document.getElementById('reset-btn');

function addMessage(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return wrap;
}

function addResults(rows) {
  if (!rows || rows.length === 0) return;
  const grid = document.createElement('div');
  grid.className = 'results';
  for (const r of rows) {
    const card = document.createElement('div');
    card.className = 'card';
    const price = '$' + Math.round(r.current_bid).toLocaleString();
    const bin = r.buy_it_now_price ? ' · BIN $' + Math.round(r.buy_it_now_price).toLocaleString() : '';
    card.innerHTML = `<b>${r.year} ${r.make} ${r.model}</b> — ${price}${bin}<br>
      ${r.odometer.toLocaleString()} mi · ${r.primary_damage} · ${r.title_type} title · ${r.has_keys ? 'has keys' : 'no keys'}<br>
      ${r.yard_city}, ${r.yard_state} · lot #${r.lot_id}`;
    grid.appendChild(card);
  }
  chatEl.appendChild(grid);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function updateFiltersBar(filters) {
  const keys = Object.keys(filters || {});
  if (keys.length === 0) {
    filtersBar.textContent = 'No filters applied yet.';
    return;
  }
  filtersBar.textContent = 'Active filters: ' + keys.map(k => `${k}=${JSON.stringify(filters[k])}`).join('  ·  ');
}

async function sendMessage(message) {
  sendBtn.disabled = true;
  addMessage('user', message);
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, session_id: sessionId }),
    });
    const data = await res.json();
    sessionId = data.session_id;
    addMessage('assistant', data.reply);
    addResults(data.results);
    updateFiltersBar(data.filters);
  } catch (err) {
    addMessage('assistant', 'Something went wrong talking to the server. Please try again.');
  } finally {
    sendBtn.disabled = false;
  }
}

formEl.addEventListener('submit', (e) => {
  e.preventDefault();
  const message = inputEl.value;
  if (!message.trim()) return;
  inputEl.value = '';
  sendMessage(message);
});

resetBtn.addEventListener('click', async () => {
  if (!sessionId) { chatEl.innerHTML = ''; updateFiltersBar({}); return; }
  await fetch('/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId }),
  });
  chatEl.innerHTML = '';
  updateFiltersBar({});
  addMessage('assistant', 'Filters cleared - what are you looking for?');
});

addMessage('assistant', "Hi! Tell me what kind of vehicle you're looking for - I can filter by make/model, price, mileage, year, damage type, title status, and location, and you can keep refining across messages.");
</script>
</body>
</html>
